name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: { matrix: { python-version: ["3.10", "3.12"] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install -e ".[dev]"
      - uses: actions/setup-node@v5
        with: { node-version: '24' }
      - name: Image geometry and scenery controls (LCOV)
        run: |
          mkdir -p coverage
          node --test --experimental-test-coverage --test-coverage-lines=90 --test-coverage-branches=70 --test-coverage-functions=90 --test-reporter=spec --test-reporter=lcov --test-reporter-destination=stdout --test-reporter-destination=coverage/web-scenes.lcov --test-coverage-include='apps/web/*core.mjs' --test-coverage-include='apps/web/*core.js' tests/web-scenes.test.mjs
      - run: python -m pytest -q --cov=engine --cov=agents --cov=integrations --cov=services --cov-report=xml:coverage.xml --cov-report=term-missing:skip-covered
      - name: Export LCOV
        run: coverage lcov -o coverage.lcov
      - name: Scene editing and billing contract coverage gate
        run: |
          python -m pytest -q tests/test_scene_edit.py tests/test_checkout_contract.py tests/test_billing.py --cov=engine.scene_edit --cov=integrations.billing --cov-branch --cov-fail-under=90 --cov-report=xml:coverage/workbench-release.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          report = ET.parse('coverage/workbench-release.xml').getroot()
          assert int(report.attrib['lines-covered']) > 0
          assert float(report.attrib['line-rate']) >= 0.9
          assert float(report.attrib['branch-rate']) >= 0.7
          classes = report.findall('.//class')
          assert len(classes) == 2
          for source in classes:
              assert float(source.attrib['line-rate']) >= 0.9
              assert float(source.attrib['branch-rate']) >= 0.7
          PY
      - name: Upload coverage artifacts (Cobertura + LCOV)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage.xml
            coverage.lcov
            coverage/web-scenes.lcov
            coverage/workbench-release.xml
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with: { files: coverage.xml, fail_ci_if_error: false }
      - run: PYTHONPATH=. python -m services.api.server --smoke --port 8796
      - name: secret scan
        run: "! grep -R -E 'LLM_[0-9]{6,}|ghp_[A-Za-z0-9_]{20,}|-----BEGIN .*PRIVATE KEY-----' --exclude-dir=.git --exclude-dir=.github --exclude-dir=node_modules --exclude-dir=.next . || (echo 'secret pattern found' && exit 1)"
