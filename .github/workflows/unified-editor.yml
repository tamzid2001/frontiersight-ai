name: Unified editor browser regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  chromium-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: pip install -e '.[dev]'
      - run: npm ci
        working-directory: tests/browser
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - run: npm test
        working-directory: tests/browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unified-editor-browser-evidence
          if-no-files-found: warn
          path: |
            tests/browser/test-results
            tests/browser/playwright-report
