name: Enterprise web and Firestore verification
on:
  push:
    paths: ['packages/enterprise-web/**', 'services/api/clerk_auth.py', 'services/api/firestore_scenes.py', 'services/api/workspace_http.py', 'tests/test_firestore.py', 'scripts/verify-firestore-emulator.sh', '.github/workflows/enterprise-web.yml']
  pull_request:
    paths: ['packages/enterprise-web/**', 'services/api/**', 'tests/test_firestore.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: enterprise-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/enterprise-web/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm ci --prefix packages/enterprise-web
      - run: pip install -e '.[dev]' pytest-cov
      - run: bash scripts/verify-firestore-emulator.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: enterprise-web-coverage
          if-no-files-found: error
          path: |
            packages/enterprise-web/coverage/cobertura-coverage.xml
            packages/enterprise-web/coverage/lcov.info
            coverage/firestore.xml
