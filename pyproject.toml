[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frontiersight-ai"
version = "0.18.0"
description = "FrontierSight AI — from video to verifiable physical-world intelligence (Meta Global AI Hackathon 2026)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["engine", "agents", "integrations", "integrations.meta", "services", "services.api"]
