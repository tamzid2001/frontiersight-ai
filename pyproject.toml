[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frontiersight-ai"
version = "0.32.0"
description = "FrontierSight AI — from video to verifiable physical-world intelligence (Meta Global AI Hackathon 2026)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "google-cloud-firestore==2.34.1", "clerk-backend-api==7.0.0", "meta-sam-parser==0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["engine", "agents", "integrations", "integrations.meta", "services", "services.api"]
