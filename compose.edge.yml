services:
  edge:
    build:
      context: .
      dockerfile: Dockerfile.edge
    ports:
      - "127.0.0.1:8830:8830"
    volumes:
      - frontier-edge:/data
    environment:
      MODEL_API_KEY: ${MODEL_API_KEY:-}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  frontier-edge:
